name: Verify both interpretations
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install hash-verified Lean 4.34.0
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --fail --location --retry 3 https://github.com/leanprover/lean4/releases/download/v4.34.0/lean-4.34.0-linux.tar.zst -o lean-4.34.0-linux.tar.zst
          echo 'caaa98356098c85dc0fcbbd28e1ec66f39eb6551829972b752ff20e1286b646b  lean-4.34.0-linux.tar.zst' | sha256sum --check
          tar --zstd -xf lean-4.34.0-linux.tar.zst
          echo "$RUNNER_TEMP/lean-4.34.0-linux/bin" >> "$GITHUB_PATH"
      - name: Fetch pinned dependency cache
        shell: bash
        run: |
          set -euo pipefail
          lake exe cache get Mathlib.Data.Finset.Powerset Mathlib.Tactic
          git diff --exit-code -- lean-toolchain lake-manifest.json lakefile.toml
      - name: Build, audit all declarations, replay, and cross-check
        run: python3 scripts/verify_complete.py
      - name: Archive source and actual verification evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: jsp690-complete-evidence
          path: |
            evidence-complete/
            JSP690.lean
            Transversal.lean
            Complete690.lean
            AuditGenerated.lean
            StatementAudit.lean
            lean-toolchain
            lakefile.toml
            lake-manifest.json
            README.md
            STATEMENT.md
            TRANSVERSAL_ATTRIBUTION.md
            ATTRIBUTION.md
            scripts/
          retention-days: 30
